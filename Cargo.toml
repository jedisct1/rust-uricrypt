[package]
name = "uricrypt"
version = "0.1.14"
edition = "2021"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "Deterministic URI and URL encryption that preserves shared path prefixes and hierarchy, with authenticated components"
keywords = ["uri", "url", "encryption", "prefix-preserving", "deterministic"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-uricrypt"
repository = "https://github.com/jedisct1/rust-uricrypt"
categories = ["cryptography"]
readme = "README.md"

[lib]
name = "uricrypt"
path = "src/lib.rs"

[dependencies]
sha3 = "0.10"
base64 = "0.22"
